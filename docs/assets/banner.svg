<rect x="492" width="150" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="567" y="26" text-anchor="middle" fill="#cfd5e6">без аналитики</text>
