<radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".30"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
